[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB

build_flags =
  ; Without CDC_ON_BOOT, Serial goes to UART0 on the *other* USB-C port
  ; and the monitor stays silent. This cost an evening on the twilight switch.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall
  -Wextra

; The platform appends -Wno-unused-parameter to every build and the last flag
; wins, so -Wunused-parameter in build_flags above has no effect. build_src_flags
; is emitted afterwards, and only for src/ -- so this re-arms the warning for our
; code without unsuppressing thousands of them inside the framework.
build_src_flags = -Wunused-parameter

; Pure-logic env: lib/stats has no Arduino in it, so the averaging can be
; tested on the laptop without the board attached.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall -Wextra
