; `pio run` builds firmware only. The native env exists purely for
; `pio test -e native` and has no sources to link into a program.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB

; Host-side unit tests. Possible only because lib/twilight has no
; hardware dependencies.
[env:native]
platform         = native
test_framework   = unity
lib_ignore       = ldr, relay      ; these pull in ESP-IDF
build_src_filter = -<*>            ; so does src/main.c
build_flags      = -std=c11 -Wall -Wextra -Wunused-parameter
